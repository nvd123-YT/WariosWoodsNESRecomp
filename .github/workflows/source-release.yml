name: Build platform launchers and publish a new release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            label: macOS ARM64
            runner: macos-15
          - id: windows-x64
            label: Windows x64
            runner: windows-2022
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-22.04

    steps:
      - name: Checkout project and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore cached Windows build tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            .tools/cmake
            .tools/uv
            .tools/python
          key: windows-build-tools-cmake-3.31.6-uv-0.6.14-python-3.12.9-v1

      - name: Set up packaging Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux compiler and desktop development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxfixes-dev libxss-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libudev-dev libfuse2

      - name: Bootstrap bundled CMake and managed Python (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash setup.sh

      - name: Bootstrap bundled CMake and managed Python (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: cmd
        run: setup.bat

      - name: Install Python app packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Create synthetic NROM test cartridge (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python tests/create_smoke_rom.py --output "$RUNNER_TEMP/warioswoods-ci-smoke.nes"

      - name: Create synthetic NROM test cartridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Rom = Join-Path $env:RUNNER_TEMP "warioswoods-ci-smoke.nes"
          python tests/create_smoke_rom.py --output $Rom
          if ($LASTEXITCODE -ne 0) { throw "Smoke ROM generation failed: $LASTEXITCODE" }

      - name: Verify exact game ROM fingerprints
        run: python -m unittest discover -s tests -p "test_rom_identity.py"

      - name: Configure native test build (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CMAKE="$(cat .tools/cmake-path.txt)"
          "$CMAKE" -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DNESRECOMP_ROM="$RUNNER_TEMP/warioswoods-ci-smoke.nes"

      - name: Compile and smoke-test native runtime (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CMAKE="$(cat .tools/cmake-path.txt)"
          "$CMAKE" --build build-ci --parallel 4
          python tools/verify_bundled_packages.py --build-dir build-ci
          ./build-ci/WariosWoodsRecomp "$RUNNER_TEMP/warioswoods-ci-smoke.nes" --frames 120

      - name: Configure native test build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $CMake = (Get-Content .tools/cmake-path.txt -Raw).Trim()
          $Rom = Join-Path $env:RUNNER_TEMP "warioswoods-ci-smoke.nes"
          & $CMake -S . -B build-ci "-DNESRECOMP_ROM=$Rom"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }

      - name: Compile and smoke-test native runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $CMake = (Get-Content .tools/cmake-path.txt -Raw).Trim()
          & $CMake --build build-ci --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native build failed: $LASTEXITCODE" }
          python tools/verify_bundled_packages.py --build-dir build-ci
          if ($LASTEXITCODE -ne 0) { throw "Bundled NESRecomp packages verification failed: $LASTEXITCODE" }
          $Rom = Join-Path $env:RUNNER_TEMP "warioswoods-ci-smoke.nes"
          $Exe = Join-Path $PWD "build-ci/Release/WariosWoodsRecomp.exe"
          & $Exe $Rom --frames 120
          if ($LASTEXITCODE -ne 0) { throw "Native smoke test failed: $LASTEXITCODE" }

      - name: Smoke-test widescreen presentation (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          NESRECOMP_NO_LAUNCHER: "1"
        shell: bash
        run: |
          ./build-ci/WariosWoodsRecomp "$RUNNER_TEMP/warioswoods-ci-smoke.nes" --widescreen 16:9 --present-out "$RUNNER_TEMP/warioswoods-wide.png" --present-every 120 --exit-after 120
          python tools/verify_widescreen_capture.py "$RUNNER_TEMP/warioswoods-wide.png" --width 426 --height 240

      - name: Smoke-test widescreen presentation (Windows)
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          NESRECOMP_NO_LAUNCHER: "1"
        shell: pwsh
        run: |
          $Rom = Join-Path $env:RUNNER_TEMP "warioswoods-ci-smoke.nes"
          $Capture = Join-Path $env:RUNNER_TEMP "warioswoods-wide.png"
          $Exe = Join-Path $PWD "build-ci/Release/WariosWoodsRecomp.exe"
          & $Exe $Rom --widescreen 16:9 --present-out $Capture --present-every 120 --exit-after 120
          if ($LASTEXITCODE -ne 0) { throw "Widescreen rendering test failed: $LASTEXITCODE" }
          python tools/verify_widescreen_capture.py $Capture --width 426 --height 240
          if ($LASTEXITCODE -ne 0) { throw "Widescreen capture verification failed: $LASTEXITCODE" }

      - name: Create self-contained ROM-free builder payload
        shell: bash
        run: python tools/package_builder.py --output payload.zip

      - name: Verify standalone macOS CMake inside packaged payload
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import zipfile

          member = "project/.tools/cmake/cmake/data/bin/cmake"
          with zipfile.ZipFile("payload.zip") as archive:
              if member not in archive.namelist():
                  raise SystemExit(f"Missing standalone CMake executable in payload: {member}")
              with tempfile.TemporaryDirectory() as temporary:
                  archive.extract(member, temporary)
                  cmake = Path(temporary) / member
                  cmake.chmod(cmake.stat().st_mode | 0o111)
                  result = subprocess.run(
                      [str(cmake), "--version"],
                      check=True,
                      text=True,
                      capture_output=True,
                  )
                  print(result.stdout.strip())
                  if "cmake version 3.31.6" not in result.stdout:
                      raise SystemExit("Unexpected CMake version in the packaged macOS payload.")
              if any("CMake.app" in name for name in archive.namelist()):
                  raise SystemExit("The macOS payload must not contain a nested CMake.app bundle.")
          PY

      - name: Package macOS application and DMG
        if: matrix.id == 'macos-arm64'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name WariosWoodsRecomp --osx-bundle-identifier com.nvd123.warioswoodsrecomp --add-data "$PWD/payload.zip:payload" --distpath dist --workpath pyinstaller-work launcher.py
          test -d dist/WariosWoodsRecomp.app
          mkdir -p dmg-staging release
          ditto dist/WariosWoodsRecomp.app dmg-staging/WariosWoodsRecomp.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Wario's Woods Recompiled" -srcfolder dmg-staging -ov -format UDZO release/WariosWoodsRecomp-macOS-ARM64.dmg
          hdiutil verify release/WariosWoodsRecomp-macOS-ARM64.dmg

      - name: Package Windows standalone EXE
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WariosWoodsRecomp --add-data "$($PWD.Path)\payload.zip;payload" --distpath dist --workpath pyinstaller-work launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/WariosWoodsRecomp.exe release/WariosWoodsRecomp-Windows-x64.exe
          if (-not (Test-Path release/WariosWoodsRecomp-Windows-x64.exe)) { throw "Windows launcher EXE was not created." }

      - name: Package Linux AppImage
        if: matrix.id == 'linux-x64'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name WariosWoodsRecomp --add-data "$PWD/payload.zip:payload" --distpath dist --workpath pyinstaller-work launcher.py
          mkdir -p AppDir/usr/bin release
          install -m 755 dist/WariosWoodsRecomp AppDir/usr/bin/WariosWoodsRecomp
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/WariosWoodsRecomp" "$@"
          APPRUN
          chmod 755 AppDir/AppRun
          cat > AppDir/warioswoods.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=Wario's Woods Recompiled Builder
          Comment=Build Wario's Woods locally from your own ROM
          Exec=WariosWoodsRecomp
          Icon=warioswoods
          Type=Application
          Categories=Game;Emulator;
          Terminal=false
          DESKTOP
          cat > AppDir/warioswoods.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#26313b"/>
            <rect x="44" y="44" width="72" height="72" rx="10" fill="#75bf42"/>
            <rect x="116" y="44" width="72" height="72" rx="10" fill="#f2c84b"/>
            <rect x="80" y="116" width="72" height="72" rx="10" fill="#e85b48"/>
            <rect x="152" y="116" width="60" height="60" rx="10" fill="#71a8d8"/>
            <path d="M44 188h168" stroke="#f4f0df" stroke-width="8" stroke-linecap="round"/>
            <path d="M70 212h116" stroke="#f4f0df" stroke-width="8" stroke-linecap="round" opacity=".65"/>
          </svg>
          SVG
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" -o appimagetool.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage --no-appstream AppDir release/WariosWoodsRecomp-Linux-x64.AppImage
          chmod +x release/WariosWoodsRecomp-Linux-x64.AppImage
          test -s release/WariosWoodsRecomp-Linux-x64.AppImage
          file release/WariosWoodsRecomp-Linux-x64.AppImage

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.id }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish a new release with separate platform downloads
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download all three platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -s release-assets/WariosWoodsRecomp-macOS-ARM64.dmg
          test -s release-assets/WariosWoodsRecomp-Windows-x64.exe
          test -s release-assets/WariosWoodsRecomp-Linux-x64.AppImage
          ls -lh release-assets

      - name: Create a new GitHub Release for this successful push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          TITLE="Platform launchers #$GITHUB_RUN_NUMBER ($SHORT_SHA)"
          NOTES="$(printf '%s\n' \
            'Three separate platform downloads are attached:' \
            '- WariosWoodsRecomp-macOS-ARM64.dmg (contains WariosWoodsRecomp.app)' \
            '- WariosWoodsRecomp-Windows-x64.exe' \
            '- WariosWoodsRecomp-Linux-x64.AppImage' \
            '' \
            'These are local-build launchers, not prebuilt game binaries. Open the launcher, select a compatible Wario's Woods .nes ROM that you are legally entitled to use, and let it generate and compile the native game locally.' \
            '' \
            'The packages include the launcher runtime, portable CMake, managed Python, NESRecomp, recomp-ui, SDL2 sources and project configuration. The operating-system C/C++ compiler and SDK must already be installed: Xcode Command Line Tools on macOS, Visual Studio 2022 C++ tools on Windows, or a compiler and desktop development libraries on Linux.' \
            '' \
            'No ROM, ROM-derived game code, saves, or prebuilt Wario's Woods executable is distributed. Each platform package was built and checked in CI using a synthetic test cartridge.')"
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
